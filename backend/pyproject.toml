[project]
name = "acquireos"
version = "0.1.0"
description = "Acquisition research for UK private companies, built on Companies House data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
acquireos = "acquireos.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acquireos*"]

[tool.setuptools.package-data]
acquireos = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
