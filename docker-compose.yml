# AcquireOS stack.
#
# Portainer: Stacks > Add stack > Web editor. Paste this whole file and click
# Deploy the stack. It works with no environment variables; then open
# http://<pi-address>:8090
#
# Recommended environment variables (Portainer: "Environment variables",
# Advanced mode, one NAME=value per line):
#   DB_PASSWORD=<long random>   set this BEFORE the first deploy: Postgres only
#                               reads it when the database is first created
#   API_TOKEN=<long random>     needed to connect Claude (MCP)
#   APP_PASSWORD=<password>     if the app is reachable outside your network
#   BACKUP_DIR=/mnt/nas/acquireos
# The database is not exposed outside the stack, so the default database
# password is only reachable by these containers.
#
# Plain Docker: copy .env.example to .env, then `docker compose up -d`.
#
# The image is built for amd64 and arm64, so the same file runs on a
# Raspberry Pi 4/5 (64-bit OS), a home server or a cloud host.

services:
  db:
    image: postgres:16-alpine
    container_name: acquireos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: acquireos
      POSTGRES_USER: acquireos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acquireos-change-me}
    volumes:
      - acquireos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquireos -d acquireos"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${ACQUIREOS_IMAGE:-ghcr.io/ryancoombes/acquireos:latest}
    container_name: acquireos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://acquireos:${DB_PASSWORD:-acquireos-change-me}@db:5432/acquireos
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Token for Claude (MCP at /mcp) and scripts. Generate one with:
      #   docker exec acquireos acquireos new-token
      API_TOKEN: ${API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    ports:
      - "${APP_PORT:-8090}:8000"
    volumes:
      # Large files for command-line imports, such as the PSC snapshot.
      - ${DATA_DIR:-/opt/acquireos/data}:/data

  # Downloads and loads the Companies House files once a month:
  # company data, the latest month of filed accounts, and owners (PSC).
  # Needs a few GB of free space in DATA_DIR while it runs.
  scheduler:
    image: ${ACQUIREOS_IMAGE:-ghcr.io/ryancoombes/acquireos:latest}
    container_name: acquireos-scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["acquireos", "scheduler"]
    # The scheduler has no web server, so the image's web health check
    # does not apply to it.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://acquireos:${DB_PASSWORD:-acquireos-change-me}@db:5432/acquireos
      REFRESH_DAY: ${REFRESH_DAY:-6}
      REFRESH_HOUR: ${REFRESH_HOUR:-3}
      REFRESH_ACCOUNTS_MONTHS: ${REFRESH_ACCOUNTS_MONTHS:-1}
      TZ: ${TZ:-Europe/London}
    volumes:
      - ${DATA_DIR:-/opt/acquireos/data}:/data

  # Nightly database dump at 02:30. Point BACKUP_DIR at your NAS mount.
  backup:
    image: postgres:16-alpine
    container_name: acquireos-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: acquireos
      PGPASSWORD: ${DB_PASSWORD:-acquireos-change-me}
      PGDATABASE: acquireos
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/London}
    volumes:
      - ${BACKUP_DIR:-/opt/acquireos/backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backups run daily at 02:30 into /backups"
        while true; do
          if [ "$$(date +%H%M)" = "0230" ]; then
            f=/backups/acquireos-$$(date +%Y%m%d).sql.gz
            pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "Backup written: $$f"
            find /backups -name 'acquireos-*.sql.gz' -mtime +$$KEEP_DAYS -delete
            sleep 60
          fi
          sleep 30
        done

volumes:
  acquireos-db:
