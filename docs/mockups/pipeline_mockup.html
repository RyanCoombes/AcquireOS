<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline options</title>
<style>
:root{--ink:#14181f;--ink2:#4a5261;--ink3:#8a91a0;--line:#e6e8ec;--canvas:#f5f6f8;--teal:#0e7c66;--tint:#e8f5f1}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--canvas)}
.wrap{padding:18px 20px 60px}
.pick{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink2)}
.pick button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.about{color:var(--ink2);font-size:13px;margin:6px 0 16px;max-width:820px}
h1{font-size:26px;margin:0 0 12px}
.opt{display:none}.opt.on{display:block}
.name{font-weight:650;font-size:13px;line-height:1.25}
.sc{font-weight:700;border-radius:6px;padding:0 6px;background:var(--tint);color:#0a5e4d;font-size:12px}
.val{font-size:12px;color:var(--ink2)}
.logo{width:28px;height:28px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.due{font-size:12px;color:#c0392b;font-weight:600}
.nxt{font-size:12px;color:var(--ink2)}
.days{font-size:11px;color:var(--ink3)}

/* ---------- A: Journey track ---------- */
.track{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;overflow-x:auto}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;cursor:pointer}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#eef0f3;color:var(--ink3)}
.step.has .dot{background:var(--tint);color:var(--teal)}
.step.ms .dot{width:40px;height:40px;font-size:15px;background:var(--teal);color:#fff;box-shadow:0 0 0 5px var(--tint)}
.step.ms.none .dot{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.step .lbl{font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.2}
.step.ms .lbl{font-weight:700;color:var(--ink)}
.link{flex:1;height:2px;background:var(--line);min-width:14px;margin-bottom:22px}
.aboard{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
.acol{flex:0 0 240px}
.acol h3{font-size:13px;margin:0 2px 8px;display:flex;justify-content:space-between}
.acol h3 span{color:var(--ink3);font-weight:500}
.acol.ms h3{color:var(--teal)}
.acard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.acard .r{display:flex;gap:9px;align-items:center}
.acard .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.acol.ms .acard{border-color:#9fd3c4;box-shadow:0 2px 0 var(--teal)}

/* ---------- B: Gradient headers ---------- */
.bboard{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
.bcol{flex:0 0 236px;background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.bhead{padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.bhead .t{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.bhead .t b{font-size:20px}
.bhead .d{font-size:11.5px;opacity:.85}
.bhead .ms{display:inline-block;background:rgba(255,255,255,.25);border-radius:5px;font-size:10.5px;font-weight:700;padding:1px 6px;margin-bottom:4px}
.bcol.ms{border:2px solid var(--a);transform:translateY(-4px);box-shadow:0 8px 22px rgba(20,24,31,.12)}
.bbody{padding:10px;min-height:70px}
.bcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfcfd}
.bcard .r{display:flex;gap:9px;align-items:center}
.bcard .m{display:flex;justify-content:space-between;margin-top:7px}
.bempty{font-size:12px;color:var(--ink3);text-align:center;padding:16px 0}

/* ---------- C: Phase lanes ---------- */
.lane{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;display:grid;grid-template-columns:150px 1fr;overflow:hidden}
.lane .lh{padding:14px;background:var(--s);border-right:1px solid var(--line)}
.lane .lh b{display:block;font-size:15px;color:var(--c)}
.lane .lh span{font-size:12px;color:var(--ink2)}
.lane .stages{display:flex;overflow-x:auto}
.cstage{flex:1 0 220px;padding:12px;border-right:1px dashed var(--line)}
.cstage:last-child{border-right:0}
.cstage h4{margin:0 0 8px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.cstage h4 .n{color:var(--ink3);font-weight:500}
.cstage.ms h4{color:var(--c)}
.cstage.ms h4::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--c);display:inline-block}
.ctile{display:flex;gap:9px;align-items:center;border-radius:10px;padding:8px 9px;margin-bottom:6px;background:var(--canvas)}
.ctile .info{flex:1;min-width:0}
.ctile .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnone{font-size:12px;color:var(--ink3)}
.lane.quiet .stages{opacity:.7}
</style></head><body><div class="wrap">
<h1>Pipeline: three directions</h1>
<div class="pick">
 <button class="on" data-o="a">A · Journey track</button>
 <button data-o="b">B · Bold column headers</button>
 <button data-o="c">C · Phase lanes</button>
</div>
<div class="about" id="about"></div>

<div class="opt on" id="a"></div>
<div class="opt" id="b"></div>
<div class="opt" id="c"></div>
</div>
<script>
const P={assess:{l:'Assess',c:'#2f62d8',c2:'#5b8cff',s:'#eef3ff'},engage:{l:'Engage',c:'#d9822b',c2:'#f2a65a',s:'#fdf1e3'},
 deal:{l:'Deal',c:'#7a4fd6',c2:'#a07cf0',s:'#f3eefe'},owned:{l:'Owned',c:'#1e9a57',c2:'#4cc283',s:'#e6f6ec'}};
const S=[['watching','Watching','assess','Check again later'],['researching','Assessing','assess','Does it fit?'],['approach','Shortlisted','assess','Worth approaching'],
 ['contacted','First contact','engage','Letter, call or intro',1],['in_talks','Getting to know','engage','Meetings, no numbers'],['nda','NDA and accounts','engage','Accounts, clients, people'],
 ['offer','Indicative offer','deal','Price range in writing'],['heads','Heads of terms','deal','Exclusivity, 4–8 weeks',1],['diligence','Due diligence','deal','Lender alongside'],
 ['spa','SPA and disclosure','deal','Lawyers draft'],['completion','Completion','deal','Funds paid',1],['handover','Handover','owned','Owner supports']];
const C=[['watching','LINDEN IT SERVICES LIMITED',84,'£230k–1.35m','12 days','#3b6fd9'],['watching','THORNBURY IT SUPPORT LIMITED',71,'£211k–1.24m','64 days','#5a7bb5'],
 ['researching','KESTREL COMPUTING LIMITED',78,'£410k–1.90m','6 days','#2b8a9a'],['approach','ASHCOMBE SOFTWARE LIMITED',100,'£461k–2.70m','2 days','#445566','due','Write to owner · 8 Nov'],
 ['contacted','BRIGHTFIELD DIGITAL LIMITED',100,'£1.50m–2.51m','3 days','#c2702a','nxt','Follow-up call · 14 Nov'],['contacted','FERNHILL DIGITAL LIMITED',100,'£2.78m–4.63m','1 day','#a0602a']];
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('');
const logo=c=>`<div class="logo" style="background:${c[5]}">${ini(c[1])}</div>`;
const extra=c=>c[6]?`<div class="${c[6]}" style="margin-top:6px">→ ${c[7]}</div>`:'';
const of=k=>C.filter(c=>c[0]===k);
const about={a:'A row of steps across the top shows the whole journey at a glance, with milestones as big filled circles (filled = something is there). The board below stays calm and white; milestone columns get a teal heading and cards with a teal underline. One accent colour, nothing shouty.',
 b:'Each column gets a bold gradient header in its phase colour with a big count. Milestone columns are lifted and outlined so they stand out. Most colourful option; cards stay plain so names are easy to read.',
 c:'One horizontal lane per phase (Assess, Engage, Deal, Owned) instead of 12 side-by-side columns: far less sideways scrolling. Milestones get a diamond marker. Cards become compact tiles with logo, name, score and value. Empty phases are quieter.'};

// A
let t='<div class="track">';S.forEach((s,i)=>{const n=of(s[0]).length;
 t+=(i?'<div class="link"></div>':'')+`<div class="step ${s[4]?'ms':''} ${n?'has':'none'}"><div class="dot">${s[4]?'★':n||''}</div><div class="lbl">${s[1]}${s[4]&&n?' · '+n:''}</div></div>`;});
t+='</div><div class="aboard">';
S.forEach(s=>{const it=of(s[0]);if(!it.length&&!s[4])return;
 t+=`<div class="acol ${s[4]?'ms':''}"><h3>${s[1]}<span>${it.length}</span></h3>`+(it.length?it.map(c=>`<div class="acard"><div class="r">${logo(c)}<div class="name">${c[1]}</div></div><div class="m"><span class="sc">${c[2]}</span><span class="val">${c[3]}</span></div><div class="m"><span class="days">${c[4]} in stage</span></div>${extra(c)}</div>`).join(''):'<div class="acard days">Nothing here yet</div>')+'</div>';});
t+='</div><p class="days" style="margin-top:8px">Empty non-milestone stages are hidden from the board; they are still in the track above and in Move to….</p>';
document.getElementById('a').innerHTML=t;

// B
let b='<div class="bboard">';S.forEach(s=>{const it=of(s[0]),p=P[s[2]];
 b+=`<div class="bcol ${s[4]?'ms':''}" style="--a:${p.c};--b:${p.c2}"><div class="bhead">${s[4]?'<span class="ms">★ MILESTONE</span>':''}<div class="t">${s[1]}<b>${it.length}</b></div><div class="d">${s[3]}</div></div><div class="bbody">`+
 (it.length?it.map(c=>`<div class="bcard"><div class="r">${logo(c)}<div class="name">${c[1]}</div></div><div class="m"><span class="sc">${c[2]}</span><span class="val">${c[3]}</span></div><div class="m"><span class="days">${c[4]}</span></div>${extra(c)}</div>`).join(''):'<div class="bempty">Empty</div>')+'</div></div>';});
document.getElementById('b').innerHTML=b+'</div>';

// C
let c='';Object.entries(P).forEach(([k,p])=>{const st=S.filter(s=>s[2]===k);const tot=st.reduce((a,s)=>a+of(s[0]).length,0);
 c+=`<div class="lane ${tot?'':'quiet'}" style="--c:${p.c};--s:${p.s}"><div class="lh"><b>${p.l}</b><span>${tot} compan${tot==1?'y':'ies'}</span></div><div class="stages">`+
 st.map(s=>{const it=of(s[0]);return `<div class="cstage ${s[4]?'ms':''}"><h4>${s[1]} <span class="n">${it.length}</span></h4>`+(it.length?it.map(x=>`<div class="ctile">${logo(x)}<div class="info"><div class="name">${x[1]}</div><div class="val">${x[3]} · <span class="days">${x[4]}</span></div>${extra(x)}</div><span class="sc">${x[2]}</span></div>`).join(''):'<div class="cnone">—</div>')+'</div>';}).join('')+'</div></div>';});
document.getElementById('c').innerHTML=c;

const ab=document.getElementById('about');ab.textContent=about.a;
document.querySelectorAll('.pick button').forEach(x=>x.onclick=()=>{document.querySelectorAll('.pick button,.opt').forEach(e=>e.classList.remove('on'));x.classList.add('on');document.getElementById(x.dataset.o).classList.add('on');ab.textContent=about[x.dataset.o];});
</script></body></html>
