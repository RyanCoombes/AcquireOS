<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline options</title>
<style>
:root{--ink:#14181f;--ink2:#4a5261;--ink3:#8a91a0;--line:#e6e8ec;--canvas:#f5f6f8;--teal:#0e7c66;--tint:#e8f5f1;
 --assess:#2f62d8;--assessS:#eef3ff;--engage:#d9822b;--engageS:#fdf1e3;--deal:#7a4fd6;--dealS:#f3eefe;--owned:#1e9a57;--ownedS:#e6f6ec}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--canvas)}
.wrap{padding:18px 20px 60px}
.pick{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink2)}
.pick button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.about{color:var(--ink2);font-size:13px;margin:6px 0 16px;max-width:860px}
h1{font-size:26px;margin:0 0 12px}
.opt{display:none}.opt.on{display:block}
.name{font-weight:650;font-size:13px;line-height:1.25}
.sc{font-weight:700;border-radius:6px;padding:0 6px;background:var(--tint);color:#0a5e4d;font-size:12px}
.val{font-size:12px;color:var(--ink2)}
.days{font-size:11.5px;color:var(--ink3)}
.stale{color:#c0392b}
.logo{width:28px;height:28px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.due{font-size:12px;color:#c0392b;font-weight:600}
.nxt{font-size:12px;color:var(--ink2)}
.more{display:block;width:100%;border:1px dashed #cfd4dc;background:transparent;border-radius:9px;padding:6px;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;margin-top:2px}

/* D: funnel split */
.split{display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:16px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.ph b{font-size:14px}
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.tabs button.on{background:var(--assessS);color:var(--assess)}
.tabs button i{font-style:normal;font-weight:500;opacity:.75}
.filter{padding:8px 10px;border-bottom:1px solid var(--line)}
.filter input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.list{max-height:520px;overflow:auto}
.lrow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #f0f1f4;cursor:grab}
.lrow:hover{background:#fafbfc}
.lrow .info{flex:1;min-width:0}.lrow .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.engage-board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
.ecol{flex:0 0 232px;border-radius:14px;padding:10px;background:#eceef2;min-height:160px}
.ecol h3{margin:0 4px 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.ecol h3 .n{color:var(--ink3);font-weight:500}
.ecol.ms{background:var(--s);box-shadow:inset 0 0 0 2px var(--c)}
.ecol.ms h3{color:var(--c)}
.flag{font-size:10.5px;font-weight:700;color:#fff;background:var(--c);border-radius:5px;padding:1px 6px;margin-left:6px}
.ecard{background:#fff;border-radius:10px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,24,31,.08)}
.ecard .r{display:flex;gap:9px;align-items:center}.ecard .m{display:flex;justify-content:space-between;margin-top:7px}
.eempty{border:1.5px dashed #d5d9e0;border-radius:10px;padding:14px 8px;text-align:center;font-size:12px;color:var(--ink3)}
.phase-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px 2px}
.phases{display:flex;gap:18px;overflow-x:auto}

/* E: capped columns */
.cboard{display:flex;gap:10px;overflow-x:auto;align-items:flex-start}
.cgroup{display:flex;flex-direction:column;gap:6px}
.gh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0 4px;display:flex;align-items:center;gap:8px}
.gh::after{content:"";flex:1;height:2px;background:currentColor;opacity:.35;border-radius:2px}
.gcols{display:flex;gap:10px}
.ccol{flex:0 0 220px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;border-top:3px solid var(--c)}
.ccol h3{margin:0 2px 8px;font-size:13px;display:flex;justify-content:space-between}
.ccol h3 .n{font-weight:700;color:var(--c)}
.ccol.ms{box-shadow:0 0 0 2px var(--c),0 8px 20px rgba(20,24,31,.08)}
.ccol.ms h3{color:var(--c)}
.ccol.thin{flex-basis:130px;background:transparent;border-style:dashed}
.ccol.thin h3{font-size:12px;color:var(--ink3)}
.ccard{display:flex;gap:9px;align-items:center;border-radius:9px;padding:7px 8px;margin-bottom:5px;background:#f7f8fa}
.ccard .info{flex:1;min-width:0}.ccard .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.sortnote{font-size:11px;color:var(--ink3);margin:0 2px 6px}
</style></head><body><div class="wrap">
<h1>Pipeline: two more directions (with 40 in Watching)</h1>
<div class="pick">
 <button class="on" data-o="d">D · Funnel split</button>
 <button data-o="e">E · Capped columns</button>
</div>
<div class="about" id="about"></div>
<div class="opt on" id="d"></div>
<div class="opt" id="e"></div>
</div>
<script>
const P={assess:['#2f62d8','#eef3ff'],engage:['#d9822b','#fdf1e3'],deal:['#7a4fd6','#f3eefe'],owned:['#1e9a57','#e6f6ec']};
const S=[['watching','Watching','assess'],['researching','Assessing','assess'],['approach','Shortlisted','assess'],
 ['contacted','First contact','engage',1],['in_talks','Getting to know','engage'],['nda','NDA and accounts','engage'],
 ['offer','Indicative offer','deal'],['heads','Heads of terms','deal',1],['diligence','Due diligence','deal'],['spa','SPA and disclosure','deal'],['completion','Completion','deal',1],
 ['handover','Handover','owned']];
const words=['LINDEN','THORNBURY','KESTREL','ASHCOMBE','BRIGHTFIELD','FERNHILL','HARBOURLINE','NORTHGATE','CALDER','MERIDIAN','OAKRIDGE','PENRITH','QUAYSIDE','REDWING','SEVERN','TALBOT','UPLAND','VALE','WESTBROOK','ARDEN'];
const kinds=['IT SERVICES','DIGITAL','COMPUTING','SOFTWARE','NETWORKS','IT SUPPORT','SYSTEMS','TECHNOLOGY'];
const cols=['#3b6fd9','#5a7bb5','#2b8a9a','#445566','#c2702a','#a0602a','#6a5acd','#2e8b57','#8b4c7a','#4b6584'];
let seed=7;const rnd=n=>{seed=(seed*9301+49297)%233280;return Math.floor(seed/233280*n)};
const mk=(st,i)=>{const nm=`${words[rnd(20)]} ${kinds[rnd(8)]} LIMITED`;const lo=100+rnd(900);return {st,nm,sc:55+rnd(46),val:`£${lo}k–${(lo*5/1000).toFixed(2)}m`,d:rnd(90),c:cols[rnd(10)]};};
const C=[];[['watching',40],['researching',6],['approach',9],['contacted',3],['in_talks',1],['heads',1]].forEach(([s,n])=>{for(let i=0;i<n;i++)C.push(mk(s,i))});
C.find(c=>c.st==='approach').due='Write to owner · 8 Nov';C.find(c=>c.st==='contacted').nxt='Follow-up call · 14 Nov';
const of=k=>C.filter(c=>c.st===k).sort((a,b)=>(b.due?1:0)-(a.due?1:0)||b.sc-a.sc);
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('');
const logo=c=>`<div class="logo" style="background:${c.c}">${ini(c.nm)}</div>`;
const days=c=>`<span class="days ${c.d>45?'stale':''}">${c.d}d</span>`;
const extra=c=>c.due?`<div class="due" style="margin-top:5px">→ ${c.due}</div>`:c.nxt?`<div class="nxt" style="margin-top:5px">→ ${c.nxt}</div>`:'';
const about={d:'Early stages are high-volume and low-effort, later stages are few and important, so they get different layouts. Left: Watching, Assessing and Shortlisted as a tabbed, searchable, scrollable list (40 or 400, it stays the same size). Right: the real deal board from First contact onwards, big cards, phase colours, milestones outlined. Drag a row from the list onto the board to make first contact.',
 e:'Keeps one board, but every column shows at most 5 cards (overdue actions first, then highest score) with "+35 more" to expand that column only. Empty stages shrink to thin dashed slots, so the busy and milestone stages get the space. Phase colour lines group the columns.'};

// D
const assessSt=S.filter(s=>s[2]==='assess');
let d=`<div class="split"><div class="panel"><div class="ph"><b>Lining up</b><span class="days">${assessSt.reduce((a,s)=>a+of(s[0]).length,0)} companies</span></div>
<div class="tabs">${assessSt.map((s,i)=>`<button class="${i==0?'on':''}" data-s="${s[0]}">${s[1]} <i>${of(s[0]).length}</i></button>`).join('')}</div>
<div class="filter"><input placeholder="Filter by name"></div><div class="list" id="dlist"></div></div><div class="phases">`;
['engage','deal','owned'].forEach(ph=>{const st=S.filter(s=>s[2]===ph);const [c,s]=P[ph];
 d+=`<div><div class="phase-tag" style="color:${c}">${ph[0].toUpperCase()+ph.slice(1)}</div><div class="engage-board">`+st.map(x=>{const it=of(x[0]);
  return `<div class="ecol ${x[3]?'ms':''}" style="--c:${c};--s:${s}"><h3><span>${x[1]}${x[3]?'<span class="flag">★</span>':''}</span><span class="n">${it.length}</span></h3>`+
  (it.length?it.map(k=>`<div class="ecard"><div class="r">${logo(k)}<div class="name">${k.nm}</div></div><div class="m"><span class="sc">${k.sc}</span><span class="val">${k.val}</span></div><div class="m"><span></span>${days(k)}</div>${extra(k)}</div>`).join(''):'<div class="eempty">Drop here</div>')+'</div>';}).join('')+'</div></div>';});
d+='</div></div>';
document.getElementById('d').innerHTML=d;
const fill=s=>{document.getElementById('dlist').innerHTML=of(s).map(k=>`<div class="lrow">${logo(k)}<div class="info"><div class="name">${k.nm}</div><div class="val">${k.val} · ${days(k)}</div>${extra(k)}</div><span class="sc">${k.sc}</span></div>`).join('')};
fill('watching');
document.querySelectorAll('#d .tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#d .tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fill(b.dataset.s)});

// E
let e='<div class="cboard">';
Object.entries(P).forEach(([ph,[c,s]])=>{const st=S.filter(x=>x[2]===ph);
 e+=`<div class="cgroup"><div class="gh" style="color:${c}">${ph}</div><div class="gcols">`+st.map(x=>{const it=of(x[0]);const thin=!it.length&&!x[3];
  return `<div class="ccol ${x[3]?'ms':''} ${thin?'thin':''}" style="--c:${c}"><h3><span>${x[1]}${x[3]&&!thin?' ★':''}</span><span class="n">${it.length}</span></h3>`+
  (it.length>5?'<div class="sortnote">Due first, then score</div>':'')+
  it.slice(0,5).map(k=>`<div class="ccard">${logo(k)}<div class="info"><div class="name">${k.nm}</div><div class="val">${k.val} · ${days(k)}</div>${extra(k)}</div><span class="sc">${k.sc}</span></div>`).join('')+
  (it.length>5?`<button class="more">+${it.length-5} more</button>`:'')+(!it.length&&x[3]?'<div class="eempty">Drop here</div>':'')+'</div>';}).join('')+'</div></div>';});
document.getElementById('e').innerHTML=e+'</div>';

const ab=document.getElementById('about');ab.textContent=about.d;
document.querySelectorAll('.pick button').forEach(x=>x.onclick=()=>{document.querySelectorAll('.pick button,.opt').forEach(el=>el.classList.remove('on'));x.classList.add('on');document.getElementById(x.dataset.o).classList.add('on');ab.textContent=about[x.dataset.o];});
</script></body></html>
